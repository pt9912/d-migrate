name: Build & Test

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  DMIGRATE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Build, test, run detekt and verify coverage
        # --no-build-cache: kover-Verify konsumiert die `.exec`-Daten
        # aus dem konkreten Test-Lauf. Der gradle/actions/setup-gradle
        # Cache-Restore zwischen Runs hat in der Vergangenheit stale
        # Execution-Daten zurueckgespielt (knapp-unter-90% Boundary-
        # Flakes auf z.B. :hexagon:core). Die per-Modul-Konfiguration
        # in build.gradle.kts (`outputs.cacheIf { false }` auf Test +
        # koverVerify/koverGenerate*) reicht dafuer in CI nicht aus.
        # Seit 0.9.6 ist `cache-disabled: true` deshalb fuer alle Runs
        # gesetzt (vorher nur fuer Tag-Builds). Damit ist sowohl die
        # Task-Output-Wiederverwendung (`--no-build-cache`) als auch der
        # Dependency-/Kotlin-Compiler-Cache der setup-gradle-Action
        # ausgeschaltet. Bei Persistenz des Flakes ggf. zusaetzlich
        # `outputs.upToDateWhen { false }` auf Test-Tasks setzen.
        run: make ci-build

      - name: Generate coverage reports
        if: always()
        run: make coverage-modules-html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: '**/build/reports/kover/html/**'
          retention-days: 14

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 14

      - name: Build release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release-assets

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: adapters/driving/cli/build/release/*
          retention-days: 14

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build OCI image locally
        run: make oci-build

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag dmigrate/d-migrate:latest ghcr.io/${{ github.repository }}:latest
          docker tag dmigrate/d-migrate:latest ghcr.io/${{ github.repository }}:${VERSION}
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${VERSION}
