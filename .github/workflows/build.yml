name: Build & Test

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  DMIGRATE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build, test, run detekt and verify coverage
        # --no-build-cache: kover-Verify konsumiert die `.exec`-Daten
        # aus dem konkreten Test-Lauf. Deshalb bleibt der CI-Build in der
        # Dockerfile-Stage ebenfalls mit `--no-build-cache` verdrahtet.
        run: make ci-build

      - name: Generate coverage reports
        if: always()
        run: make docker-coverage-modules-html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-reports
          path: '**/build/reports/kover/html/**'
          retention-days: 14

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 14

      - name: Build release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release-assets

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets
          path: adapters/driving/cli/build/release/*
          retention-days: 14

  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify Kover excludes ledger and Markdown links
        # Fail-closed Doku-Gate, das bisher nur lokal (`make gates`/`make ci`)
        # lief und daher in CI nicht erzwungen war:
        #  - verify-kover-excludes-ledger.py: jeder Kover-Exclude MUSS in
        #    docs/coverage/excludes-ledger.md registriert sein.
        #  - d-check (öffentliches ghcr.io/pt9912/d-check-Image): Markdown-
        #    Link-/Anker-/Kennungs-Validierung über docs/ + spec/.
        # Spiegelt `make docs-check` 1:1; kein ghcr-Login nötig (Image public).
        run: make docs-check

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Nur dieser Job pusht nach GHCR (GITHUB_TOKEN); build/docs-check bleiben read-only.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build OCI image locally
        run: make docker-oci-build

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag dmigrate/d-migrate:latest ghcr.io/${{ github.repository }}:${VERSION}
          docker push ghcr.io/${{ github.repository }}:${VERSION}
          # :latest nur für Stable-Releases. Prerelease-Tags (SemVer: Version enthält
          # ein '-', z. B. v1.0.0-RC1) lassen :latest auf dem letzten Stable stehen —
          # sonst zeigte ein `docker pull …:latest` auf eine instabile Vorabversion.
          case "$VERSION" in
            *-*) echo "Prerelease $VERSION — :latest bleibt auf dem letzten Stable" ;;
            *)   docker tag dmigrate/d-migrate:latest ghcr.io/${{ github.repository }}:latest
                 docker push ghcr.io/${{ github.repository }}:latest ;;
          esac

      # Docker Hub ist ein Spiegel von GHCR, kein eigener Build: gepusht wird
      # exakt dasselbe lokal gebaute Image. GHCR bleibt die Referenz-Registry.
      # Der `secrets`-Kontext ist in `if:` von Steps nicht verfügbar, daher wird
      # die Secret-Präsenz hier in einen Output übersetzt. Fehlt das Secret,
      # werden die beiden folgenden Steps übersprungen statt den Release-Tag
      # rot zu machen — Docker Hub ist ein optionaler Zusatzkanal.
      - name: Check for Docker Hub credentials
        id: dockerhub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN nicht gesetzt — Docker-Hub-Push übersprungen."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-migrate' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          docker tag dmigrate/d-migrate:latest "${DOCKERHUB_IMAGE}:${VERSION}"
          docker push "${DOCKERHUB_IMAGE}:${VERSION}"
          # :latest-Regel identisch zu GHCR — Prereleases fassen :latest nicht an.
          case "$VERSION" in
            *-*) echo "Prerelease $VERSION — :latest bleibt auf dem letzten Stable" ;;
            *)   docker tag dmigrate/d-migrate:latest "${DOCKERHUB_IMAGE}:latest"
                 docker push "${DOCKERHUB_IMAGE}:latest" ;;
          esac

      # Die Repository-Beschreibung auf Docker Hub ist sonst nur im Web-UI gepflegt und driftet
      # unweigerlich vom Repo weg. Quelle ist packaging/dockerhub/overview.md (reviewbar,
      # versioniert) — dieselbe Rolle, die packaging/homebrew/d-migrate.rb fuer den Tap spielt.
      #
      # Docker Hub hat DREI getrennte Felder; diese Automatik deckt zwei davon:
      #   - "Description"        -> `short-description` unten (Limit 100 Bytes)
      #   - "Repository overview" -> `readme-filepath` unten (Limit 25.000 Bytes)
      #   - "Category"           -> NICHT abgedeckt, die Action hat dafuer keinen Input.
      #                             Einmalig im Web-UI zu setzen; aendert sich praktisch nie.
      #
      # `__VERSION__` wird hier durch den gerade veroeffentlichten Tag ersetzt, damit die
      # `docker run`-Beispiele auf der Seite immer einen Tag zeigen, den es auf dem Spiegel
      # WIRKLICH gibt. Ein hartkodierter Wert veraltete still beim naechsten Release; `:latest`
      # taugt nicht, solange hier nur Prereleases liegen (Prereleases setzen :latest nicht).
      #
      # Bewusst auf JEDEM Tag (nicht nur Stable): die Beschreibung soll den Ist-Stand des
      # Spiegels beschreiben, und der aktuellste Tag ist immer pullbar.
      - name: Render Docker Hub description
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          SRC="packaging/dockerhub/overview.md"
          test -f "${SRC}"
          # Fail-fast: fehlt der Platzhalter, wurde die Datei umgebaut und die Beispiele
          # zeigen womoeglich einen veralteten Tag — das soll auffallen, nicht durchrutschen.
          grep -q '__VERSION__' "${SRC}"
          sed "s/__VERSION__/${VERSION}/g" "${SRC}" > /tmp/dockerhub-description.md
          echo "Beschreibung gerendert fuer ${VERSION} ($(wc -c < /tmp/dockerhub-description.md) Bytes)"

      # `continue-on-error`, weil dieser Step ein anderes Recht braucht als die Push-Steps:
      # die Description-API verlangt laut Action-Doku ein Token mit `read/write/DELETE`-Scope
      # (oder das Konto-Passwort), waehrend `docker push` mit read/write auskommt. Reicht der
      # Scope des vorhandenen DOCKERHUB_TOKEN nicht, soll das eine Warnung sein und NICHT den
      # Tag-Build roetten — Docker Hub ist der optionale Zusatzkanal, und ein fehlgeschlagenes
      # Seiten-Update darf ein fertiges Release nicht entwerten (gleiche Haltung wie der
      # Skip-statt-Fehler-Pfad oben). Faellt es auf, wird der Token-Scope erweitert.
      - name: Update Docker Hub description
        if: steps.dockerhub.outputs.enabled == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-migrate' }}
          # Limit 100 Bytes (Action truncated sonst still).
          short-description: "Database-agnostic CLI for schema migration and data management across PostgreSQL, MySQL, SQLite"
          readme-filepath: /tmp/dockerhub-description.md

  # Natives Container-Image (zusaetzliche Distributionsklasse neben dem JVM-Image oben).
  # build.yml besitzt die Container-Images (JVM + nativ); native-image.yml die ROHEN
  # Release-Binaries. Nur auf Tags: der native Compile im Docker (~5-8 min) ist zu schwer fuer
  # jeden Push — auf develop/main verifiziert `native-image.yml` (dispatch) den nativen Bau.
  # Bewusst ein zweiter native Compile (native-image.yml baut die Binaries): das haelt die beiden
  # Workflows entkoppelt; Reuse des Binaries spraeche CI-Minuten, koppelte sie aber.
  native-image:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build the native runtime image
        # Dieselbe Stage wie `make native-runtime-build` lokal: volle CLI nativ (GraalVM) im
        # Runtime-Image (Entrypoint = Binary, /work, non-root, mod_spatialite). Single-Arch amd64 —
        # gleich wie das JVM-Image oben (linux-arm64 = offene Frage 4 im Native-Slice).
        run: make native-runtime-build NATIVE_RUNTIME_TAG=d-migrate:native

      - name: Smoke-test the native runtime image
        # Kein kaputtes Image publizieren: DB-frei gegen die volle CLI (analog native-image.yml).
        run: |
          set -euo pipefail
          docker run --rm d-migrate:native --version
          docker run --rm d-migrate:native --help >/dev/null
          out=$(docker run --rm -v "$PWD":/work -w /work d-migrate:native \
            schema validate --source examples/sample-db/calib-schema.yaml)
          echo "${out}"
          echo "${out}" | grep -q "Validation passed" \
            || { echo "::error::native image validate smoke failed"; exit 1; }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push native image to GHCR
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          docker tag d-migrate:native "ghcr.io/${{ github.repository }}:${VERSION}-native"
          docker push "ghcr.io/${{ github.repository }}:${VERSION}-native"
          # :native = bewegliches "latest native" (analog :latest). Prereleases (Version mit '-',
          # z. B. 1.0.0-RC1) fassen es NICHT an, sonst zeigte `pull …:native` auf eine Vorabversion.
          case "$VERSION" in
            *-*) echo "Prerelease $VERSION — :native bleibt auf dem letzten Stable" ;;
            *)   docker tag d-migrate:native "ghcr.io/${{ github.repository }}:native"
                 docker push "ghcr.io/${{ github.repository }}:native" ;;
          esac

      # Docker Hub — Spiegel wie beim JVM-Image (optionaler Zusatzkanal, gleiche Secret-Logik).
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN nicht gesetzt — Docker-Hub-Push (nativ) uebersprungen."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push native image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-migrate' }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          docker tag d-migrate:native "${DOCKERHUB_IMAGE}:${VERSION}-native"
          docker push "${DOCKERHUB_IMAGE}:${VERSION}-native"
          case "$VERSION" in
            *-*) echo "Prerelease $VERSION — :native bleibt auf dem letzten Stable" ;;
            *)   docker tag d-migrate:native "${DOCKERHUB_IMAGE}:native"
                 docker push "${DOCKERHUB_IMAGE}:native" ;;
          esac
