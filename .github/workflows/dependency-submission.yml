# Meldet die aufgeloeste Gradle-Dependency-Liste an GitHubs Dependency graph.
# Grundlage fuer Dependabot-Alerts: ohne Snapshot kennt GitHub die Dependencies
# nicht und warnt entsprechend nicht.
#
# Warum nicht GitHubs "Automatic dependency submission": die faehrt mit einer
# eigenen Gradle-Version. Diese Action bekommt die Version des Builds — aus dem
# `FROM` der `deps`-Stage im Dockerfile (dort begruendet; einen Wrapper gibt es
# nicht).
#
# Statisches Parsen reicht hier nicht: die Versionen stehen in
# gradle.properties und werden interpoliert; nur ein echter Build loest sie auf.
name: Dependency Submission (Gradle)

on:
  push:
    branches:
      - main
  # Ohne Dispatch laesst sich dieser Workflow nur durch einen main-Push pruefen —
  # also nur bei einem Release. Genau deshalb blieb ein Dauerfehler hier fuenf
  # Wochen unbemerkt.
  workflow_dispatch:

permissions:
  contents: write # Dependency-Snapshot schreiben

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Explizit, weil dieser Workflow als einziger Gradle direkt auf dem Runner
      # faehrt statt im gradle-Basisimage des Dockerfiles wie der uebrige Build.
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      # Gradle-Version aus der einzigen Quelle lesen: dem `FROM` der `deps`-Stage im
      # Dockerfile (dort begruendet). Einen Wrapper gibt es nicht. `tr -d '\r'`, weil der
      # Windows-Checkout CRLF liefern kann und das verankerte Muster sonst nichts trifft.
      - name: Gradle-Version aus dem Dockerfile lesen
        id: gradle-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r' < Dockerfile | sed -n 's/^FROM gradle:\([0-9][0-9.]*\)-jdk[0-9]* AS deps$/\1/p')
          if [ -z "${version}" ]; then
            echo "::error file=Dockerfile::keine Zeile 'FROM gradle:<version>-jdk<n> AS deps'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # Gemeldet wird, was ausgeliefert wird: die Distribution entsteht aus
        # `:adapters:driving:cli:installDist`, also aus `runtimeClasspath`.
        # Ohne Filter meldet die Action JEDEN aufloesbaren Klassenpfad — Test-
        # und Build-Script-Konfigurationen eingeschlossen; Scopes, die das
        # trennen wuerden, kennt das Format nicht.
        #
        # Build-Zeit-Abhaengigkeiten bleiben trotzdem sichtbar: dependabot.yml
        # faehrt woechentliche `gradle`-Versions-Updates.
        #
        # Auf das CLI-Modul beschraenkt, weil nur DESSEN `runtimeClasspath` der
        # ausgelieferte Stand ist. Jedes Modul fuer sich aufgeloest landet zum
        # Teil niedriger — `jackson-databind` etwa auf 2.12.7.1, waehrend die
        # Konfliktaufloesung im CLI-Modul 2.21.5 zieht und genau das im Image
        # liegt. Ohne diese Grenze meldet der Graph Versionen, die nie
        # ausgeliefert werden.
        #
        # Die Anker sind Absicht. Die Doku legt nicht fest, ob die Regexe voll
        # oder teilweise matchen — die verankerte Form trifft in beiden Faellen
        # genau das Gemeinte und nie `testRuntimeClasspath`.
        with:
          gradle-version: ${{ steps.gradle-version.outputs.version }}
          dependency-graph-include-configurations: '^runtimeClasspath$'
          dependency-graph-include-projects: '^:adapters:driving:cli$'
