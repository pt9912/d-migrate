name: Sample-DB Cross-Dialect Smoke MSSQL→PG (Best-Effort)

# MSSQL-Leg der Sample-DB-Harness in der GEGENRICHTUNG (ADR 0047, Slice 4):
# SQL Server als QUELLE, PostgreSQL als Ziel — der Pfad, den
# sample-db-cross-smoke-pg2ms.yml (PG -> SQL Server) nicht abdeckt.
# Plan: docs/planning/done/mssql-dialect-scoping.md
# ADR:  docs/adr/0014-sample-db-harness-fetch-and-compose.md
#
# Faehrt `make sample-db-cross-smoke-ms2pg`: Hop 0 saet die SQL-Server-Quelle mit
# der pg2ms-Mechanik, Hop 1 faehrt reverse/validate/generate --target postgresql
# -> pre-data per psql -> data transfer --verify und prueft DREIFACHE Zeilen-
# Paritaet (PG-Original == SQL Server == PG-Rueckziel) plus die
# Rueckwaerts-Typkonvertierungen gegen die gepinnte Notes-Baseline
# examples/sample-db/expected/pagila-cross-ms2pg.notes.txt.
#
# Das SQL-Server-Image laeuft nur mit akzeptierter Microsoft-EULA (ACCEPT_EULA=Y,
# gesetzt im Compose-Service; siehe docs/user/quality.md) und ist mit ~1,5 GB
# Image / 2 GB RAM der schwerste Container der Harness. Dieses Leg faehrt
# zusaetzlich beide Hops, ist also das laengste der Sample-DB-Legs.
#
# Best-Effort: continue-on-error, damit transiente Netz-/Registry-Instabilitaeten
# den Hauptbuild nicht rot machen.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/sample-db/**'
      - 'adapters/driven/driver-mssql/**'
      # Das Leg deckt den Reverse-, View- und Chunk-Lese-Pfad ab; die geteilten
      # Anteile davon liegen in driver-common.
      - 'adapters/driven/driver-common/**'
      # Die Gegenrichtung erzeugt PostgreSQL-DDL aus einem T-SQL-Modell.
      - 'adapters/driven/driver-postgresql/**'
      - 'Makefile'
      - 'make/**'
      - 'Dockerfile'
      - '.github/workflows/sample-db-cross-smoke-ms2pg.yml'

permissions:
  contents: read

jobs:
  cross-smoke-ms2pg:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify docker compose available
        run: docker compose version

      - name: Build d-migrate:dev runtime image
        run: make docker-build IMAGE_TAG=dev

      - name: Run Sample-DB cross-dialect smoke (Pagila SQL Server -> PG)
        run: make sample-db-cross-smoke-ms2pg

      - name: Cleanup (best-effort)
        if: always()
        run: make sample-db-purge || true
