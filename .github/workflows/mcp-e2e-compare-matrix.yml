name: MCP-E2E Compare-Matrix

# 5x5-Vergleich ueber MCP gegen das echte, gebaute d-migrate:dev-Image und
# echte Server (examples/mcp-e2e, scripts/smoke-compare-matrix.sh): jeder
# Dialekt einmal Quelle, jedes andere Ziel per CLI generiert und mit dem
# Client des Dialekts angewendet, beide Seiten ueber `schema_reverse_start`
# zurueckgelesen und mit `schema_compare` und `schema_compare_start`
# verglichen. Die Funde je Zelle sind in
# examples/mcp-e2e/expected/compare-matrix.env gepinnt (versionsgebunden);
# versionsunabhaengige Waechter pruefen daneben, dass Werkzeug und Job
# dieselben Funde liefern und kein Fund nur Schreibweise, Reverse-Markierung
# oder Sequenzname ist.
#
# Oracle faehrt hier nicht mit (Kaltstart 2-3 Minuten, ~2 GB Image); lokal:
# `make mcp-e2e-compare-matrix-oracle`.
#
# Kein PR-Gate und kein Pflicht-Check — aber **sichtbar rot**: ein Lauf mit
# Abweichung scheitert (kein job-weites continue-on-error), damit eine
# gebrochene Zelle oder ein angeschlagener Waechter nicht als gruener Haken
# durchgeht. Die Artefakte des Laufs (examples/mcp-e2e/out/compare-matrix)
# werden in jedem Fall hochgeladen. Der Zeitplan faengt Abweichungen, die kein
# Push in diese Pfade ausloest; die Pfade schliessen Makefile, make/ und
# Dockerfile ein, weil das Image aus ihnen entsteht.
#
# **Und sie schliessen den gemessenen Code ein.** Was die Matrix pinnt, ist die
# Wirkung der Reader und Generatoren: ein Push, der nur einen Treiber oder das
# Hexagon aendert, verschiebt Zellen, ohne einen Pfad unter examples/ zu
# beruehren. Genau das tun die Reader-Pakete, und ohne adapters/** und
# hexagon/** liefe der Job dabei nie.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'examples/mcp-e2e/**'
      - 'adapters/**'
      - 'hexagon/**'
      - 'Makefile'
      - 'make/**'
      - 'Dockerfile'
      - '.github/workflows/mcp-e2e-compare-matrix.yml'

permissions:
  contents: read

jobs:
  compare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify docker compose, jq and sqlite3 available
        run: |
          docker compose version
          jq --version
          sqlite3 --version

      - name: Build d-migrate:dev runtime image
        run: make docker-build IMAGE_TAG=dev

      - name: Run MCP-E2E compare matrix (PostgreSQL, MySQL, SQL Server, SQLite)
        run: make mcp-e2e-compare-matrix

      - name: Upload compare-matrix artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run_attempt im Namen: github.run_id bleibt bei Re-runs gleich.
          name: mcp-e2e-compare-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: examples/mcp-e2e/out/compare-matrix
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup (best-effort)
        if: always()
        run: make mcp-e2e-purge || true
