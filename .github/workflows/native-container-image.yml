name: Native Container Image

# Natives Container-Image (zusaetzliche Distributionsklasse neben dem JVM-Image aus build.yml):
# dieselbe volle CLI als GraalVM-Binary im Runtime-Image (Entrypoint = Binary, /work, non-root,
# mod_spatialite). build.yml besitzt das JVM-Image, native-image.yml die ROHEN Release-Binaries,
# dieser Workflow das native Container-Image.
#
# KEIN eigener Compile (Issue #70): verpackt wird das `linux-x64`-Release-Asset, das
# native-image.yml gebaut, gesmoked und angehaengt hat. Ein zweiter Compile kostete ~10 min und
# ~10 GB Spitzenspeicher je Release und lieferte ein Binary, das nicht dasselbe war wie das
# veroeffentlichte. Das Image entsteht in Sekunden (Stage native-runtime-prebuilt).
#
# Zwei Einstiege, ein Code-Pfad:
#   - `workflow_call` aus native-image.yml, nachdem attach-release das Asset angehaengt hat
#     (Tag-Push; veroeffentlicht).
#   - `workflow_dispatch` fuer einen BESTEHENDEN Tag: ein Tag laesst sich nicht erneut ausloesen.
#     Ohne `publish` nur bauen und smoken (Probelauf). Scheitert dagegen der native Compile selbst,
#     ist der Weg ein Rerun von native-image.yml — ohne Asset gibt es hier nichts zu verpacken.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release-Tag, dessen linux-x64-Asset verpackt wird.'
        type: string
        required: true
      publish:
        description: 'Image nach GHCR und Docker Hub pushen.'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehender Release-Tag, dessen natives Image gebaut wird (z. B. v1.12.0).'
        type: string
        required: true
      publish:
        description: 'Image nach GHCR und Docker Hub pushen. Aus = nur bauen und smoken.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Beide Einstiege setzen `inputs.publish` ausdruecklich: der Aufruf aus native-image.yml mit
  # true (nur am Tag-Push), der Dispatch mit Default false. Ein Dispatch ueberschreibt ein
  # veroeffentlichtes Image also nur mit publish=true.
  PUBLISH: ${{ inputs.publish }}
  RELEASE_TAG: ${{ inputs.tag }}

concurrency:
  # Je Tag; ein laufender Publish wird nicht abgebrochen.
  group: native-container-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  native-container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate the release tag
        # Vor dem Checkout: ein Tippfehler im Dispatch soll sofort und lesbar scheitern.
        run: |
          set -euo pipefail
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '${RELEASE_TAG}' passt nicht auf ^v[0-9]+\.[0-9]+\.[0-9]+"
            exit 1
          fi

      - name: Checkout repository
        # Der Tag-Ref selbst, nie ein Branch: beim Aufruf aus native-image.yml der ausloesende Tag,
        # beim Dispatch der Input. Voller Verlauf samt aller Tags, weil `:native` gegen den hoechsten Stable-Tag
        # entschieden wird. Existiert der Tag nicht, scheitert der Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and :native eligibility
        id: resolve
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null \
            || { echo "::error::Tag '${RELEASE_TAG}' existiert nicht"; exit 1; }
          VERSION="${RELEASE_TAG#v}"
          # :native = bewegliches "latest native" (analog :latest). Bewegt wird es nur, wenn dieser
          # Tag die HOECHSTE Stable-Version aller v*-Tags ist: Prereleases (Tag mit '-') fassen es nie
          # an, und eine Nachlieferung fuer eine aeltere Version darf es nicht zurueckdrehen.
          MOVE_NATIVE=false
          case "${RELEASE_TAG}" in
            *-*) echo "Prerelease ${RELEASE_TAG} — :native bleibt unberuehrt" ;;
            *)
              HIGHEST=$(git tag --list 'v*' --sort=-v:refname \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
              if [ "${HIGHEST}" = "${RELEASE_TAG}" ]; then
                MOVE_NATIVE=true
              else
                echo "${RELEASE_TAG} ist nicht die hoechste Stable-Version (${HIGHEST}) — :native bleibt unberuehrt"
              fi ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "move_native=${MOVE_NATIVE}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Tag ${RELEASE_TAG}: publish=${PUBLISH}, :native bewegen=${MOVE_NATIVE}"

      - name: Download the linux-x64 release asset
        # Genau die Datei, die am Release haengt, samt ihrer veroeffentlichten Pruefsumme. Fehlt das
        # Asset (Linux-Leg von native-image.yml rot), scheitert der Lauf hier.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="d-migrate-${VERSION}-linux-x64"
          mkdir -p native-asset
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" -D native-asset \
            -p "${ASSET}" -p "${ASSET}.sha256"
          (cd native-asset && sha256sum -c "${ASSET}.sha256")
          echo "NATIVE_BINARY=native-asset/${ASSET}" >> "${GITHUB_ENV}"

      - name: Build the native runtime image from the release binary
        # Stage native-runtime-prebuilt: dasselbe Gerüst wie die kompilierende Stage
        # native-runtime (ubuntu:24.04, mod_spatialite, uid 10001, /work), nur ohne Compile.
        # Single-Arch amd64 — gleich wie das JVM-Image.
        run: make native-runtime-from-binary NATIVE_BINARY="${NATIVE_BINARY}" NATIVE_RUNTIME_TAG=d-migrate:native

      - name: Smoke-test the native runtime image
        # Kein kaputtes Image publizieren: DB-frei gegen die volle CLI (analog native-image.yml).
        run: |
          set -euo pipefail
          docker run --rm d-migrate:native --version
          docker run --rm d-migrate:native --help >/dev/null
          out=$(docker run --rm -v "$PWD":/work -w /work d-migrate:native \
            schema validate --source examples/sample-db/calib-schema.yaml)
          echo "${out}"
          echo "${out}" | grep -q "Validation passed" \
            || { echo "::error::native image validate smoke failed"; exit 1; }

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push native image to GHCR
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          MOVE_NATIVE: ${{ steps.resolve.outputs.move_native }}
        run: |
          set -euo pipefail
          docker tag d-migrate:native "ghcr.io/${{ github.repository }}:${VERSION}-native"
          docker push "ghcr.io/${{ github.repository }}:${VERSION}-native"
          if [ "${MOVE_NATIVE}" = "true" ]; then
            docker tag d-migrate:native "ghcr.io/${{ github.repository }}:native"
            docker push "ghcr.io/${{ github.repository }}:native"
          fi

      # Docker Hub — Spiegel wie beim JVM-Image (optionaler Zusatzkanal, gleiche Secret-Logik).
      - name: Check for Docker Hub credentials
        id: dockerhub
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN nicht gesetzt — Docker-Hub-Push (nativ) uebersprungen."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true' && env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push native image to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true' && env.PUBLISH == 'true'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-migrate' }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MOVE_NATIVE: ${{ steps.resolve.outputs.move_native }}
        run: |
          set -euo pipefail
          docker tag d-migrate:native "${DOCKERHUB_IMAGE}:${VERSION}-native"
          docker push "${DOCKERHUB_IMAGE}:${VERSION}-native"
          if [ "${MOVE_NATIVE}" = "true" ]; then
            docker tag d-migrate:native "${DOCKERHUB_IMAGE}:native"
            docker push "${DOCKERHUB_IMAGE}:native"
          fi
