name: Integration Tests

# Run Testcontainers-based integration tests for the JDBC drivers.
# These need Docker (for the database containers) and are too slow for the
# default Build & Test workflow (>5 min budget). They run on every push and PR
# to main, but in a separate job that does NOT block the main build.
#
# Activation: Tests tagged @Tag("integration") are excluded from the default
# test task (see root build.gradle.kts) and only run when the
# `-PintegrationTests` Gradle property is set.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    env:
      # Keep CI on the same entry point as `make integration`, while retaining
      # the workflow-specific no-build-cache guard from the previous direct
      # Gradle invocation.
      INTEGRATION_TASKS: "-PintegrationTests test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Volltext-Testimage bauen
        # Ohne diesen Schritt fehlt `d-migrate-mssql-fts:local`, und
        # MssqlFullTextEnvironmentIntegrationTest ueberspringt sich — fuenf
        # Tests, darunter ein `migrate`-Pfad, der einen Volltext-Index
        # ausserhalb der Transaktion anlegt. Ein uebersprungener Test ist gruen,
        # der Lauf sah deshalb vollstaendig aus und war es nie.
        #
        # Der Bau braucht Netz (Microsoft-Paketquelle) und laeuft deshalb hier,
        # nicht in den netzlosen Gates. Schlaegt er fehl, ist der Lauf rot:
        # stillschweigend auf das Ueberspringen zurueckzufallen waere genau der
        # Zustand, den dieser Schritt beendet.
        run: make mssql-fts-image

      - name: Run integration tests (all modules with @integration tag)
        # Plan §6.16: generischer Aufruf, sodass neue integration-Tests in
        # beliebigen Modulen automatisch mitlaufen, ohne dass dieser Workflow
        # angepasst werden muss. Mit -PintegrationTests aktiviert das
        # Root-build.gradle.kts den `integration`-Tag für alle Test-Tasks.
        #
        # --no-build-cache: siehe Begruendung in build.yml — kover-Verify
        # darf keine stale `.exec`-Daten sehen, sonst gibt es
        # knapp-unter-90% Boundary-Flakes.
        run: make integration
