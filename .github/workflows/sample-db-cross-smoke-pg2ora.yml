name: Sample-DB Cross-Dialect Smoke PG→Oracle (Best-Effort)

# Oracle-Leg der Sample-DB-Harness (ADR 0052, Slice 3b): Pagila PostgreSQL ->
# Oracle gegen das echte d-migrate:dev-CLI, symmetrisch zu
# sample-db-cross-smoke-pg2ms.yml (PG->SQL Server).
# Plan: docs/planning/done/oracle-sample-db-leg.md
# ADR:  docs/adr/0014-sample-db-harness-fetch-and-compose.md
#
# Faehrt `make sample-db-cross-smoke-pg2ora` (gepinnter Pagila-Dump -> postgres +
# oracle up -> reverse/validate/generate --target oracle -> Pre-Data per sqlplus
# anwenden -> data transfer --verify -> Per-Tabelle-Paritaet und Typ-Stichproben
# gegen die gepinnte Baseline examples/sample-db/expected/pagila-cross-ora.notes.txt).
#
# Das Oracle-Image (`gvenzl/oracle-free:23-slim-faststart`, digest-gepinnt im
# Compose-Service) braucht ~2 GB RAM und ~2-3 Minuten Kaltstart — der langsamste
# Container der Harness. Deshalb wie das MSSQL-Leg nur auf `main` und
# pfadgefiltert, nicht im PR-Gate.
#
# Best-Effort: continue-on-error, damit transiente Netz-/Registry-Instabilitaeten
# den Hauptbuild nicht rot machen.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/sample-db/**'
      - 'adapters/driven/driver-oracle/**'
      - 'adapters/driven/driver-common/**'
      - 'Makefile'
      - 'make/**'
      - 'Dockerfile'
      - '.github/workflows/sample-db-cross-smoke-pg2ora.yml'

permissions:
  contents: read

jobs:
  cross-smoke-pg2ora:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify docker compose available
        run: docker compose version

      - name: Build d-migrate:dev runtime image
        run: make docker-build IMAGE_TAG=dev

      - name: Run Sample-DB cross-dialect smoke (Pagila PG -> Oracle)
        run: make sample-db-cross-smoke-pg2ora

      - name: Cleanup (best-effort)
        if: always()
        run: make sample-db-purge || true
