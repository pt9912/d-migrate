name: SDKMAN Release

# Publiziert d-migrate als SDKMAN-Candidate-Version, sobald ein GitHub-Release veroeffentlicht wird.
#
# SEPARATER Workflow (nicht in release-homebrew.yml): eine Distributionsklasse pro Workflow,
# unabhaengig schalt-/debug-bar. `on: release` ist der von SDKMAN empfohlene Trigger und feuert erst,
# wenn das Release + seine Assets existieren → KEIN Wait-Poll noetig (anders als der attach-release-Job
# in native-image.yml, der schon zur Tag-Zeit baut). release-homebrew.yml bleibt der Release-Ersteller.
#
# VORAUSSETZUNG (einmalig, EXTERN — nicht automatisierbar): d-migrate muss ein SDKMAN-Candidate sein
# (PR an sdkman-db-migrations, dann GPG-Key an info@sdkman.io → Consumer-Key/-Token), und die Secrets
# SDKMAN_CONSUMER_KEY / SDKMAN_CONSUMER_TOKEN muessen gesetzt sein. Fehlen sie, ueberspringt der
# Workflow den Publish mit einer Notice (kein roter Release) — derselbe optionale-Zusatzkanal-Ansatz
# wie beim Docker-Hub-Spiegel. Onboarding + Verifikation: docs/planning/next/sdkman-distribution.md,
# docs/user/releasing.md 4.4.4.
#
# Artefakt: das UNIVERSAL-JVM-Launcher-ZIP `d-migrate-<version>.zip` (gradle-application-distZip,
# Struktur `d-migrate-<version>/{bin,lib}` = well-formed SDK-Archiv laut SDKMAN-Wiki; braucht Java).
# Plattform-native SDKMAN-Binaries (LINUX_64/MAC_ARM64/WINDOWS_64) sind eine dokumentierte Erweiterung
# (Slice), kein 1.0.0-Scope.

on:
  release:
    # `published` deckt Stable UND Prerelease ab; `prereleased` zusaetzlich als Absicherung (feuert bei
    # RC-Releases). Ein etwaiges Doppel-Feuern ist unkritisch: der SDKMAN-Release-POST ist idempotent.
    types: [published, prereleased]

permissions:
  contents: read

env:
  SDKMAN_CANDIDATE: d-migrate

jobs:
  sdkman:
    runs-on: ubuntu-latest
    steps:
      # secrets sind im Step-`if:` nicht verfuegbar → Praesenz in einen Output uebersetzen (Muster aus
      # build.yml Docker-Hub-Block). Ohne Credentials (Candidate noch nicht freigegeben): Skip + Notice.
      - name: Check for SDKMAN vendor credentials
        id: creds
        env:
          KEY: ${{ secrets.SDKMAN_CONSUMER_KEY }}
          TOKEN: ${{ secrets.SDKMAN_CONSUMER_TOKEN }}
        run: |
          if [ -n "${KEY}" ] && [ -n "${TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SDKMAN_CONSUMER_KEY/TOKEN nicht gesetzt — SDKMAN-Publish uebersprungen (Candidate noch nicht freigegeben?)."
          fi

      - name: Derive version and asset URL
        if: steps.creds.outputs.enabled == 'true'
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/d-migrate-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Release version to SDKMAN
        if: steps.creds.outputs.enabled == 'true'
        uses: sdkman/sdkman-release-action@3eb9347b254fc89b9af3a1ed08b874228f3dcd1f # v0.2.0
        with:
          consumer-key: ${{ secrets.SDKMAN_CONSUMER_KEY }}
          consumer-token: ${{ secrets.SDKMAN_CONSUMER_TOKEN }}
          candidate: ${{ env.SDKMAN_CANDIDATE }}
          version: ${{ steps.meta.outputs.version }}
          url: ${{ steps.meta.outputs.url }}
          platform: UNIVERSAL

      # Die Action releast nur — Default setzen ist ein separater API-Aufruf (`PUT /default`). Nur bei
      # Stable (kein Prerelease): dieselbe Regel wie `:latest`/Homebrew-nur-Stable. RCs bleiben per
      # `sdk install d-migrate <version>` ziehbar, werden aber nicht die Default-Version.
      - name: Set as SDKMAN default version (only stable)
        if: steps.creds.outputs.enabled == 'true' && github.event.release.prerelease == false
        env:
          KEY: ${{ secrets.SDKMAN_CONSUMER_KEY }}
          TOKEN: ${{ secrets.SDKMAN_CONSUMER_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/sdk-default.json -w '%{http_code}' \
            -X PUT "https://vendors.sdkman.io/default" \
            -H "Consumer-Key: ${KEY}" \
            -H "Consumer-Token: ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"candidate\":\"${SDKMAN_CANDIDATE}\",\"version\":\"${{ steps.meta.outputs.version }}\"}")
          echo "HTTP ${code}"; cat /tmp/sdk-default.json 2>/dev/null || true; echo
          case "${code}" in
            2*) echo "SDKMAN default gesetzt auf ${{ steps.meta.outputs.version }}" ;;
            *)  echo "::error::SDKMAN default fehlgeschlagen (HTTP ${code})"; exit 1 ;;
          esac
