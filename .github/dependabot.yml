# Dependabot keeps dependencies current and opens PRs for known CVEs.
# Rationale and the security reporting channel: SECURITY.md
version: 2

updates:
  # JVM dependencies. Versions live in gradle.properties and are consumed by
  # 41 build.gradle.kts files; Dependabot resolves them across the build.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Patch/minor bumps are noise individually; batch them.
      jvm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Major JDBC driver bumps change dialect behaviour and must be taken
      # deliberately with the cross-dialect matrix, not via an automated PR.
      - dependency-name: org.postgresql:postgresql
        update-types: [version-update:semver-major]
      - dependency-name: com.mysql:mysql-connector-j
        update-types: [version-update:semver-major]
      - dependency-name: org.xerial:sqlite-jdbc
        update-types: [version-update:semver-major]
      - dependency-name: com.microsoft.sqlserver:mssql-jdbc
        update-types: [version-update:semver-major]
      # Kotlin toolchain: a minor bump changes compiler/Kover behaviour and is
      # upgraded deliberately as its own slice, not via an automated PR. Patch
      # bumps pass. Hintergrund zur Codegenerierung: ADR 0043.
      #
      # `jvm` ist KEIN Tippfehler und darf nicht "aufgeraeumt" werden: Dependabot
      # leitet den Namen aus der Kurzschreibweise `kotlin("jvm")` in
      # build.gradle.kts ab und fuehrt das Plugin exakt so. `org.jetbrains.kotlin*`
      # trifft es deshalb NIE — die Regel stand wirkungslos da, bis ein
      # Gruppen-PR genau den Sprung durchliess, den sie verhindern sollte.
      - dependency-name: jvm
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlin*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlinx.kover*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Gradle wrapper is pinned to 8.12 because shadow 8.1.1 breaks on Gradle 9.
      # The Docker build uses the base-image gradle, so CI is blind to wrapper
      # bumps — an automated wrapper PR would go green yet break local ./gradlew.
      - dependency-name: gradle-wrapper

  # GitHub Actions. Third-party actions run with repository credentials,
  # so their updates are security-relevant.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images used across the multi-stage Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    ignore:
      # The gradle base image is the toolchain of the real Docker build; a major
      # bump breaks shadow 8.1.1 (Gradle 9). Taken deliberately with the wrapper.
      #
      # Beachte die Asymmetrie zum Wrapper-Pin oben: MINOR-Bumps dieses Images
      # laufen frei durch, der Wrapper ist ganz ignoriert. CI baut deshalb mit
      # der Image-Version, `./gradlew` lokal mit der Wrapper-Version — die beiden
      # driften auseinander, und CI merkt es nicht, weil sie den Wrapper nie
      # benutzt. Ein Gradle-Verhalten, das sich zwischen den beiden Versionen
      # aendert, traefe lokale Arbeit und CI unterschiedlich. Beim Angleichen
      # beide Seiten zusammen bewegen.
      - dependency-name: gradle
        update-types: [version-update:semver-major]

      # eclipse-temurin ist das JDK des ausgelieferten Runtime-Images. Nur
      # LTS-Linien kommen infrage; Zwischenversionen sind sechs Monate nach
      # Erscheinen ohne Sicherheitsupdates und wuerden Anwender auf ein
      # ungepflegtes JDK ziehen. Der Sprung auf die naechste LTS-Linie wird
      # bewusst gesetzt, zusammen mit Toolchain und Native-Image-Lauf.
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
