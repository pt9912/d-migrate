# Doku-Referenz-Checks via d-check (ghcr.io/pt9912/d-check) — ersetzt
# scripts/verify-doc-refs.sh (Pilot-Migration 2026-06-12, Shell-Familie).
# Die Default-Scan-Wurzeln (docs/, spec/, Root-*.md) decken den
# Alt-Tool-Umfang ab; `anchors` ist bewusste Mehr-Abdeckung
# (Anker-Validierung, Bildreferenzen — das Alt-Tool prüfte beides nicht).

# scan.ignore: eingefrorenes Done-Archiv aus dem Scan nehmen.
# docs/planning/done-archive/ enthält abgeschlossene, kalt gestellte
# Pläne (unveränderliche Historie); sie auf Referenz-Frische zu prüfen
# wäre dauerhaftes Rauschen ohne Nutzen. docs/planning/done/ bleibt im
# Scan (frisch abgeschlossen). Begründung: ADR 0010. docs/archive/ (kalt
# gestellte/retirete Artefakte wie das retirete design.md) ebenso ausgenommen.
scan:
  ignore: ["docs/planning/done-archive/**", "docs/archive/**"]

modules: [links, anchors, matrix, hostpaths, spans, codepaths, ids, pins, citations, workflows, versions]

# matrix: mechanisiert die Referenz-Richtung (Stable Dependencies
# Principle, konventionen.md "Referenz-Richtung (SDP)"): Spec-Straten
# verweisen nie abwärts — weder auf ADRs noch auf Pläne/Slices/Roadmap —,
# und Verweise auf überholte Stände (superseded/deprecated) sind verboten.
# Provenance in Historie-/Versions-Sektionen ist ausgenommen (SDP-Regel 5).
# ADR→Slice/Plan abwärts ist bewusst KEINE Regel: laut Regelwerk
# (konventionen.md, Zeile "Referenz-Richtung (SDP)") sind "Abwärts-/
# Seitwärts-Verweise Kontext, keine Spezifikation" = erlaubt (consulted:/
# Slice-Provenienz). Hart erzwungen ist nur der Spec-Abwärts-Bann oben
# (konventionen.md, Zeile "Cross-Reference-Trigger": Spec→ADR existiert
# nicht im bindenden Text, auch nicht als Quellen-Spalte). Eine adr→plan-
# Regel flaggte nur legitime Provenienz (Probe 2026-06-28: 19 Refs/14 ADRs).
matrix:
  classes:
    - name: spec
      paths: ["spec/**"]
      # Spec-interne Straten (konventionen.md "Spec-Straten": Rang Vertrag › Technik › Sicht;
      # architecture.md = Sicht = unterste Schicht). [^a] = alle Specs außer architecture
      # (einzige a*-Datei) → Technik-Schicht (Rang 1); architecture explizit als Rang 2 = Sicht.
      order: ["spec/lastenheft-d-migrate.md", "spec/[^a]*.md", "spec/architecture.md"]   # Rang 0 Vertrag (Lastenheft), Rang 1 Technik (Topical, Peers), Rang 2 Sicht (architecture)
      direction: no-downward
    - name: adr
      paths: ["docs/adr/[0-9]*.md"]
    # Zwei Klassen statt einer, und NICHT zu `docs/planning/**` zusammenfassen:
    # eine Datei gehoert zu genau einer Klasse, und eine ueberlappende breitere
    # `paths` laesst die engere Regel still ausfallen.
    - name: plan-roadmap
      paths: ["docs/planning/in-progress/**"]
    - name: plan-internal
      paths:
        - "docs/planning/open/**"
        - "docs/planning/next/**"
        - "docs/planning/done/**"
        - "docs/planning/done-archive/**"
    # user darf auf roadmap.md zeigen (dauerhafter Top-Level-Aggregator, wandert
    # laut in-progress/README nie), aber nicht in den beweglichen Teil des
    # Planungsbaums: open/next/done/done-archive durchlaufen den Lebenszyklus aus
    # ADR 0004, ihre Pfade sind instabil und ihr Inhalt ist Arbeitsmaterial.
    - name: user
      paths: ["docs/user/**"]
  rules:
    - {from: spec, to: adr, allow: false}
    - {from: spec, to: plan-roadmap, allow: false}
    - {from: spec, to: plan-internal, allow: false}
    - {from: user, to: plan-internal, allow: false}
  status:
    forbidden: [superseded, deprecated]
  exclude-sections: [Historie, Geschichte, Versionierung, Changelog, Änderungshistorie]

# hostpaths/spans: keine Konfiguration nötig; Probe 2026-06-16 je 0
# Befunde (keine Maschinenpfad-Leaks, keine Span-Artefakte).

# codepaths: prüft Inline-Code-Repo-Pfade auf Existenz. scope auf docs/spec
# (Root-*.md wie CHANGELOG ausgenommen — unveränderliche Historie). roots =
# Repo-Pfad-Präfixe, gegen die wurzel-relative Pfade aufgelöst werden.
# scope.ignore: Done-Archiv (ADR 0010) + reine Zukunfts-Adapter-Specs als
# Sub-Area-Ausnahme mit Graduations-Trigger. Dauerhafte Nicht-Repo-Pfade
# (Nutzer-CWD, Build-Ausgaben) tragen d-check:ignore-Marker. Begründung +
# Konvention: ADR 0011.
codepaths:
  roots: [adapters, config, docs, examples, gradle, hexagon, ledger, packaging, scripts, spec, test]
  scope:
    roots: [docs, spec]
    ignore:
      - "docs/planning/done-archive/**"
      - "spec/jsqlparser-adapter.md"   # Zielbild-Spec künftiger Adapter; Graduation bei Adapter-Bau (ADR 0011)
      - "spec/grpc-service.md"         # Zielbild-Spec künftiger Adapter; Graduation bei Adapter-Bau (ADR 0011)
      - "spec/rest-service.md"         # Zielbild-Spec künftiger Adapter; Graduation bei Adapter-Bau (ADR 0011)

# ids: Kennungs-Verlinkungspflicht im Fließtext. Modell aus
# `d-check --suggest-config` (Kennungen nur aus Definitions-Headings):
# UC-NN aus dem Lastenheft, ADR-NNNN mit Ziel docs/adr/. LF/LN-Mandat aktiv
# (D2 revidiert 2026-06-28 — LF/LN müssen aufs Lastenheft verlinkt sein).
# scope wie codepaths (CHANGELOG/Archiv aus).
ids:
  scope:
    roots: [docs, spec]
    ignore: ["docs/planning/done-archive/**", "docs/archive/**"]
  patterns:
    - regex: 'UC-\d+'
      target: "spec/lastenheft-d-migrate.md"
      link-policy: always
    - regex: 'ADR-\d{4}'
      target: "docs/adr/"
      link-policy: always
    - regex: 'L[FN]-\d{3}'
      target: "spec/lastenheft-d-migrate.md"
      link-policy: always

# workflows: Actions-Referenzen SHA-gepinnt (Supply-Chain), lokale
# Reusable-Workflow-Aufrufe rechte-gedeckt. Wir haben keine lokalen
# `uses: ./.github/workflows/...`-Aufrufe (geprüft 2026-09-05) -- das Modul
# deckt bei uns nur die SHA-Pin-Pflicht ab, die schon durchgängig gelebt wird.
workflows:
  dir: .github/workflows

# versions: gepinnte ghcr-Image-Verweise gegen die aktuelle Version. Docker-
# Tags tragen (anders als der Git-Tag) kein führendes "v" -- current-from
# zeigt deshalb auf einen eigenen `docker-tag`-Anker in version.md, nicht auf
# `#aktuell` (das "v1.2.0" trägt, ein reiner String-Vergleich ohne
# Praefix-Normalisierung würde sonst JEDEN echten Pin als veraltet melden;
# empirisch gegen den Digest sha256:e31a372b... verifiziert 2026-09-05).
# exempt-paths: zwei historische Pins in bereits geschlossenen Untersuchungen
# (ein exaktes Terminal-Protokoll in einem Codefence + ein Roadmap-
# Rueckblick-Absatz) -- beide referenzieren absichtlich eine alte Version.
versions:
  pin-pattern: 'ghcr\.io/pt9912/d-migrate:(\d+\.\d+\.\d+)'
  current-from: version.md#docker-tag
  exempt-paths:
    - "docs/planning/done/oci-image-runtime-divergence.md"
    - "docs/planning/in-progress/roadmap.md"

# vcs: git-Diff-Immutabilitaet fuer akzeptierte ADRs (nicht in `modules:` --
# braucht eine Commit-Range, nicht Teil des hermetischen `make docs-check`-
# Laufs; nur ueber `make doc-immutable RANGE=<base>..<head>` bzw. gezieltes
# `--enable vcs --range` genutzt). Unsere ADRs tragen den Status im
# YAML-Frontmatter (`status: accepted`), nicht als Body-Zeile `**Status:**` --
# status-line/immutable-when/head-allow entsprechend angepasst.
vcs:
  paths: ["docs/adr/[0-9]*.md"]
  immutable-when: '^status: accepted'
  status-line: '^status:'
  head-allow: '^status: (accepted|superseded by ADR-\d{4})'
