    kind: "*"
    reason: "View visible-signature-compatibility covered in PostgresViewRendererTest; matrix promotion follows."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §8 D.1
  - workstream: D.2
    dialect: "*"
    kind: "*"
    reason: "MySQL VIEW_ROUTINE_USAGE privilege-preflight is live-DB; matrix needs a stub-probe seam (B-Vervollst)."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §8 D.2
  - workstream: E.1
    dialect: "*"
    kind: "*"
    reason: "Routine migration body-normalisation is covered in routine-migration tests; matrix promotion follows once routine fixtures are dialect-neutral."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §9 E.1
  - workstream: E.3
    dialect: "*"
    kind: "*"
    reason: "Sequence migration cross-dialect surface is large (PG/MySQL/SQLite helper_table emulation); promotion to matrix requires dedicated fixture pairs per emulation flag."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §9 E.3
  - workstream: F.0
    dialect: "*"
    kind: "*"
    reason: "Versioned migration-overlay grundvertrag covered in MigrationOverlayPreflightTest; matrix surface follows."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §10 F.0
  - workstream: F.1
