  - workstream: F.4
    dialect: "*"
    kind: "*"
    reason: "Rename mappings + cli-inline-overlay covered in InlineRenameOverlayBuilderTest; matrix promotion follows."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §10 F.4
  - workstream: F.4-renderer-blocker-bridge
