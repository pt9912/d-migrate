    kind: "*"
    reason: "Internal renderer-blocker classifier slice covered by PlannerBlockerClassifierTest; matrix exposure not yet meaningful."
    planRef: docs/planning/done/ImpPlan-0.9.7-F.4-renderer-blocker-bridge.md
