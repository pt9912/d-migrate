    kind: "*"
    reason: "Automated data transformations are not yet implemented (Phase 1.x); carve-out until F.1 lands."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §10 F.1
  - workstream: F.2
    dialect: "*"
    kind: "*"
    reason: "Versioned plan-artefacts already covered by MigrationPlanArtifactBuilderTest + Compatibility tests; matrix promotion follows once artefact-emission can be exercised file-mode."
    planRef: docs/planning/in-progress/diffresult-migration-plan-2.md §10 F.2
  - workstream: F.3
    dialect: "*"
    kind: "*"
