schema_format: "1.0"
name: "matrix-D3-desired"
version: "1.0.0"

tables:
  orders:
    columns:
      id:
        type: identifier
        auto_increment: true
      status:
        type: text
        max_length: 32
        required: true
    primary_key: [id]

views:
  order_count:
    description: "Materialized count of all orders"
    materialized: true
    # `fast` traegt die Blocker-Zelle auf JEDEM Dialekt: MySQL, SQLite und
    # SQL Server blocken schon an der Objektart, Oracle am fehlenden
    # Materialized View Log (ORA-23413). Ohne die Angabe waere die Zelle fuer
    # Oracle unanwendbar, seit es MVs nativ rendert.
    refresh: "fast on commit"
    query: |
      SELECT COUNT(*) AS total FROM orders
    dependencies:
      tables: [orders]
    source_dialect: postgresql
