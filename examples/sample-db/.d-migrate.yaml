# Sample-DB-Harness Connection-Config
# Plan: docs/planning/done/sample-db-integration-harness.md
#
# Container-Pfad: der dmigrate-Service erreicht postgres über das
# Compose-Netz (Service-DNS `postgres`, Container-Port 5432).
# ${VAR}-Substitution kommt aus der Container-Env (env_file: .env).

database:
  connections:
    # Phase 1 (Pagila/PG-Round-Trip)
    pagila_pg: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pagila"
    pagila_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pagila_target"
    # Phase 2 (Cross-Dialect) — mysql-Service über Compose-DNS `mysql:3306`
    sakila_my: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/sakila"
    pagila_my_target: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/pagila_target"
    sakila_pg_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sakila_target"
    # MSSQL-Leg (Slice 3b) — SQL-Server-Ziel fuer Pagila PG -> MSSQL.
    # encrypt=false: der Container hat nur ein Self-Signed-Zertifikat.
    pagila_ms_target: "mssql://sa:${MSSQL_SA_PASSWORD}@mssql:1433/pagila_target?encrypt=false"
    # MSSQL-Leg Gegenrichtung (Slice 4) — SQL Server als QUELLE, PG als Rueckziel.
    # pagila_ms_src saet Hop 0 des Smokes; pagila_back nimmt Hop 1 auf.
    pagila_ms_source: "mssql://sa:${MSSQL_SA_PASSWORD}@mssql:1433/pagila_ms_src?encrypt=false"
    pagila_pg_back: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pagila_back"
    # Oracle-Leg (Slice 3b) — Oracle-Ziel fuer Pagila PG -> Oracle.
    # Pfadteil ist der SERVICE-NAME der PDB, nicht die SID.
    pagila_ora_target: "oracle://${APP_USER}:${APP_USER_PASSWORD}@oracle:1521/FREEPDB1"
    # Phase 3 (Scale, Employees) — MySQL-Quelle + MySQL- und PG-Ziel.
    # Die DBs legt der Scale-Smoke selbst an (idempotent), da initdb nur
    # bei frischem Volume läuft.
    employees_my: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/employees"
    employees_my_target: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/employees_my_target"
    employees_pg_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/employees_pg_target"
    # Phase 5 (Spatial, VA1-Live-Smoke) — PostGIS via postgis-Service, MySQL native
    # via mysql-Service. Quell-/Ziel-DBs legt smoke-spatial.sh an (idempotent).
    postgis_geo_src: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/geo_pg_src"
    postgis_geo_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/geo_pg_target"
    geo_my_src: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/geo_my_src"
    geo_my_target: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/geo_my_target"
    # 5a (echtes PostGIS-nyc): dedizierte DBs, damit der Reverse (kein --tables-Filter)
    # nur nyc_neighborhoods sieht — keine Kollision mit den geo_pg_*-Tabellen oben.
    nyc_pg_src: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/nyc_src"
    nyc_pg_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:5432/nyc_target"
    # Phase 4 (TPC-H, 4b Round-Trip) — postgres-Service. Quell-/Ziel-DBs legt
    # smoke-tpch.sh an (idempotent); die TPC-H-Tabellen kommen aus dem 4a-Generator
    # (runtime-generierte DuckDB-schema.sql + CSVs, kein TPC-Artefakt im Repo).
    tpch_pg_src: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tpch"
    tpch_pg_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tpch_target"
    # 4c (Volumen-Abnahme): dedizierte Re-Import-Ziel-DB, getrennt vom 4b-Ziel.
    tpch_perf_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tpch_perf_target"
    # Phase 4 (TPC-DS, optionaler 4e Round-Trip) — postgres-Service. Quell-/Ziel-DBs legt
    # smoke-tpcds.sh an (idempotent); die 24 TPC-DS-Tabellen kommen aus dem 4e-Generator
    # (runtime-generierte DuckDB-schema.sql + CSVs, kein TPC-Artefakt im Repo).
    tpcds_pg_src: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tpcds"
    tpcds_pg_target: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tpcds_target"

# Schreib-Praeferenzen (dialect-preference-mechanism.md).
write:
  oracle:
    # Pagila fuehrt in zwei NOT-NULL-Textspalten leere Strings
    # (address.district: 3 Zeilen, address.phone: 2 von 603). Oracle setzt
    # den leeren String mit NULL gleich, sie sind dort also nicht
    # schreibbar. Der Harness erklaert deshalb ausdruecklich, was an ihre
    # Stelle tritt -- statt dass das Smoke-Skript die Quelle still
    # umschreibt und der Lauf gruen aussieht, ohne dass jemand den
    # Unterschied gesehen haette.
    empty_string: "literal: "
