# BI-Demo Compose-Stack — Spec: docs/planning/in-progress/bi-demo-compose.md
#
# Aktuelle Services (BD.1): postgres, seaweed-config (one-shot),
# seaweed, seaweed-init (one-shot), aws-tools (profile=tools).
# Spaetere Slices ergaenzen sql/-Init (BD.2), metabase (BD.3),
# optionalen dmigrate-Container (BD.4).

services:
  postgres:
    image: postgres:17.10-trixie
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmigrate -d dmigrate_demo"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  seaweed-config:
    image: amazon/aws-cli:2.34.61
    env_file:
      - .env
    volumes:
      - seaweed-config:/etc/seaweed
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        esc_key="$${S3_ACCESS_KEY//\\/\\\\}"
        esc_key="$${esc_key//\"/\\\"}"
        esc_sec="$${S3_SECRET_KEY//\\/\\\\}"
        esc_sec="$${esc_sec//\"/\\\"}"
        cat > /etc/seaweed/s3.json <<EOF
        {
          "identities": [
            {
              "name": "demo",
              "credentials": [
                {
                  "accessKey": "$$esc_key",
                  "secretKey": "$$esc_sec"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        chmod 444 /etc/seaweed/s3.json
    restart: "no"

  seaweed:
    image: chrislusf/seaweedfs:4.31
    depends_on:
      seaweed-config:
        condition: service_completed_successfully
    command: server -dir=/data -s3 -s3.config=/etc/seaweed/s3.json
    ports:
      - "127.0.0.1:${S3_API_PORT}:8333"
      - "127.0.0.1:${SEAWEED_MASTER_PORT}:9333"
    volumes:
      - seaweed-data:/data
      - seaweed-config:/etc/seaweed:ro

  seaweed-init:
    image: amazon/aws-cli:2.34.61
    depends_on:
      - seaweed
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        until aws --endpoint-url http://seaweed:8333 s3api list-buckets > /dev/null 2>&1
        do
          echo 'waiting for seaweed s3…'
          sleep 2
        done
        aws --endpoint-url http://seaweed:8333 \
            s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null \
          || aws --endpoint-url http://seaweed:8333 \
            s3api create-bucket --bucket "$${S3_BUCKET}"
    restart: "no"

  aws-tools:
    image: amazon/aws-cli:2.34.61
    depends_on:
      seaweed-init:
        condition: service_completed_successfully
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        exec aws --endpoint-url http://seaweed:8333 "$$@"
      - bash
    volumes:
      - ./out:/work

volumes:
  postgres-data:
  seaweed-data:
  seaweed-config:
