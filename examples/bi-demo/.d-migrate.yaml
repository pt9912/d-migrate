# BI-Demo Connection-Config (BD.4)
# Spec: docs/planning/done-archive/bi-demo-compose.md §5.6
#
# Zwei benannte Connections fuer die zwei CLI-Pfade:
# - demo_pg            -> Host-CLI ueber den Compose-Port-Bind
#                         127.0.0.1:${POSTGRES_PORT} -> 5432
# - demo_pg_container  -> Container-CLI ueber das Compose-Netz
#                         (Service-DNS `postgres`, Container-Port 5432)
#
# ${VAR}-Substitution kommt aus der Container-/Shell-Env
# (NamedConnectionResolver in der CLI). Beim Host-CLI-Pfad muss
# der User `set -a; source examples/bi-demo/.env; set +a`
# laufen lassen, weil der Resolver nur process-Env liest, kein
# .env-File parst.

database:
  connections:
    demo_pg: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT}/${POSTGRES_DB}"
    demo_pg_container: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
