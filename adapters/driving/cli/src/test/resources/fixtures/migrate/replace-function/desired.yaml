schema_format: "1.0"
name: "TestApp"
version: "1.0.0"

functions:
  compute_total:
    parameters:
      - name: amount
        type: numeric
    returns:
      type: numeric
    language: plpgsql
    security: definer
    search_path:
      - public
      - audit
    body: |
      BEGIN
        RETURN amount * 1.20;
      END
